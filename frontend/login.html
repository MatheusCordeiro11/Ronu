<!DOCTYPE html>
<html lang="pt-BR" data-auth-tela="entrar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronu — Entrar</title>
  <meta name="description" content="Entre na sua conta Ronu para acessar suas dietas e seu histórico de treino.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/auth-entrada.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="auth-page">

    <aside class="auth-brand">
      <a href="landing/v1/index.html" class="wordmark">ronu<span>.</span></a>
      <div class="auth-brand-visual hero-carousel" id="authCarousel">
        <ul class="hero-carousel-track">
          <li class="hero-carousel-slide is-active">
            <img src="img/modalidades/foto-boxe-ringue.webp" alt="Dois boxeadores frente a frente no ringue antes da luta" loading="eager">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/foto-natacao.webp" alt="Nadador submerso visto de baixo, em preto e branco" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/foto-prancha.webp" alt="Atleta treinando abdômen com rolinho no chão da academia" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/foto-corrida-borrada.webp" alt="Atleta correndo de moletom, borrado pela velocidade" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/foto-muaythai-chute.webp" alt="Lutador chutando o saco de pancadas numa academia de muay thai" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/foto-futebol-chute.webp" alt="Jogador de futebol acertando a bola no ar" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/foto-academia-puxada.webp" alt="Atleta de regata vermelha num aparelho de puxada" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/foto-giro-2.webp" alt="Atleta girando o corpo num golpe, borrado pela velocidade" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/foto-judo-plateia.webp" alt="Judoca de quimono e faixa preta diante da plateia de um ginásio" loading="lazy">
          </li>
        </ul>

        <div class="hero-carousel-controls">
          <div class="hero-carousel-dots" role="tablist" aria-label="Selecionar imagem">
            <button type="button" class="hero-carousel-dot is-active" role="tab" aria-selected="true" aria-label="Boxe"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Natação"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Abdômen"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Corrida"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Muay thai"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Futebol"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Musculação"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Movimento"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Judô"></button>
          </div>
        </div>
      </div>
      <p class="auth-brand-quote">Treino e nutrição calculados juntos, não em planilhas separadas.</p>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1 class="auth-title">Entrar</h1>
        <p class="auth-subtitle">Acesse sua dieta e seu histórico de treino.</p>

        <div class="form-message form-message-error" id="form-error" hidden></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
            <span class="btn-label">Entrar</span>
          </button>
        </form>

        <div class="auth-divider"><span>ou</span></div>
        <div id="google-signin-button" class="google-signin-slot"></div>
        <p class="google-status" id="google-status" role="status" aria-live="polite"></p>

        <p class="auth-switch">Ainda não tem conta? <a href="cadastro.html" class="auth-switch-link">Criar conta</a></p>
      </div>
    </main>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  <script src="js/hero-carousel.js"></script>
  <script>
    // ronuTratarCredencialGoogle (callback abaixo) fica em js/auth.js.
    window.addEventListener('load', () => {
      // Carrossel primeiro: não depende do script externo do Google.
      initHeroCarousel(document.getElementById('authCarousel'), {
        autoDelay: 5000,
        resumeDelay: 8000,
      });

      // Sem o script do Google (bloqueador, rede), pula o botão em vez de
      // lançar ReferenceError — o resto da página segue funcionando.
      if (window.google) {
        google.accounts.id.initialize({
          client_id: '718933216357-u2b86snquurf6ie5m1hb9lbhu7do3opi.apps.googleusercontent.com',
          callback: ronuTratarCredencialGoogle
        });
        google.accounts.id.renderButton(
          document.getElementById('google-signin-button'),
          { theme: 'filled_black', size: 'large', width: 320, text: 'signin_with' }
        );
      }
    });
  </script>
</body>
</html>
