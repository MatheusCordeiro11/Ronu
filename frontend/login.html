<!DOCTYPE html>
<html lang="pt-BR" data-auth-tela="entrar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronu — Entrar</title>
  <meta name="description" content="Entre na sua conta Ronu para acessar suas dietas e seu histórico de treino.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page">

    <aside class="auth-brand">
      <a href="landing/v1/index.html" class="wordmark">ronu<span>.</span></a>
      <div class="auth-brand-visual hero-carousel" id="authCarousel">
        <ul class="hero-carousel-track">
          <li class="hero-carousel-slide is-active">
            <img src="img/modalidades/futebol.png" alt="Jogadores disputando a bola em um treino de futebol" loading="eager">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/jiu-jitsu.png" alt="Atleta finalizando um golpe de jiu-jitsu no tatame" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/musculacao.png" alt="Atleta levantando peso em um treino de musculação" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/boxe.png" alt="Lutadores trocando golpes em um treino de boxe" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/muay-thai.png" alt="Lutadores em clinch durante um treino de muay thai" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/basquete.png" alt="Jogadores disputando a bola em um treino de basquete" loading="lazy">
          </li>
        </ul>

        <div class="hero-carousel-controls">
          <div class="hero-carousel-dots" role="tablist" aria-label="Selecionar modalidade">
            <button type="button" class="hero-carousel-dot is-active" role="tab" aria-selected="true" aria-label="Futebol"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Jiu-jitsu"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Musculação"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Boxe"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Muay thai"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Basquete"></button>
          </div>
        </div>
      </div>
      <p class="auth-brand-quote">Treino e nutrição calculados juntos, não em planilhas separadas.</p>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1 class="auth-title">Entrar</h1>
        <p class="auth-subtitle">Acesse sua dieta e seu histórico de treino.</p>

        <div class="form-message form-message-error" id="form-error" hidden></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
            <span class="btn-label">Entrar</span>
          </button>
        </form>

        <p class="auth-switch">Ainda não tem conta? <a href="cadastro.html" class="auth-switch-link">Criar conta</a></p>
      </div>
    </main>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  <script src="js/hero-carousel.js"></script>
  <script>
    initHeroCarousel(document.getElementById('authCarousel'), {
      autoDelay: 5000,
      resumeDelay: 8000,
    });
  </script>
</body>
</html>
