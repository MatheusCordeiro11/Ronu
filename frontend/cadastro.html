<!DOCTYPE html>
<html lang="pt-BR" data-auth-tela="cadastro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronu — Criar conta</title>
  <meta name="description" content="Crie sua conta no Ronu para gerar dietas personalizadas a partir do seu treino de artes marciais.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="auth-page">

    <aside class="auth-brand">
      <a href="landing/v1/index.html" class="wordmark">ronu<span>.</span></a>
      <div class="auth-brand-visual hero-carousel" id="authCarousel">
        <ul class="hero-carousel-track">
          <li class="hero-carousel-slide is-active">
            <img src="img/modalidades/muay-thai.png" alt="Lutadores em clinch durante um treino de muay thai" loading="eager">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/basquete.png" alt="Jogadores disputando a bola em um treino de basquete" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/jiu-jitsu.png" alt="Atleta finalizando um golpe de jiu-jitsu no tatame" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/musculacao.png" alt="Atleta levantando peso em um treino de musculação" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/futebol.png" alt="Jogadores disputando a bola em um treino de futebol" loading="lazy">
          </li>
          <li class="hero-carousel-slide">
            <img src="img/modalidades/boxe.png" alt="Lutadores trocando golpes em um treino de boxe" loading="lazy">
          </li>
        </ul>

        <div class="hero-carousel-controls">
          <div class="hero-carousel-dots" role="tablist" aria-label="Selecionar modalidade">
            <button type="button" class="hero-carousel-dot is-active" role="tab" aria-selected="true" aria-label="Muay thai"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Basquete"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Jiu-jitsu"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Musculação"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Futebol"></button>
            <button type="button" class="hero-carousel-dot" role="tab" aria-selected="false" aria-label="Boxe"></button>
          </div>
        </div>
      </div>
      <p class="auth-brand-quote">Sua dieta calcula o que seu treino realmente gasta.</p>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1 class="auth-title">Criar sua conta</h1>
        <p class="auth-subtitle">Leva menos de um minuto.</p>

        <div class="form-message form-message-error" id="form-error" hidden></div>

        <!-- Campos revelados um por vez (Nome → Email → Senha → Confirmar senha
             → botão), com o mesmo accordeon .modalidade-collapse do onboarding. -->
        <form id="cadastro-form" novalidate>
          <div class="field">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>
          </div>

          <div class="modalidade-collapse" data-etapa-cadastro>
            <div class="cadastro-collapse-inner">
              <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required disabled>
              </div>
            </div>
          </div>

          <div class="modalidade-collapse" data-etapa-cadastro>
            <div class="cadastro-collapse-inner">
              <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" required disabled>
              </div>
            </div>
          </div>

          <div class="modalidade-collapse" data-etapa-cadastro>
            <div class="cadastro-collapse-inner">
              <div class="field" id="field-confirmar-senha">
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" autocomplete="new-password" required disabled>
                <span class="field-error-message" id="confirmar-senha-error" hidden></span>
              </div>
            </div>
          </div>

          <div class="modalidade-collapse" data-etapa-cadastro>
            <div class="cadastro-collapse-inner">
              <button type="submit" class="btn btn-primary btn-block" id="submit-btn" disabled>
                <span class="btn-label">Criar conta</span>
              </button>
            </div>
          </div>
        </form>

        <div class="auth-divider"><span>ou</span></div>
        <div id="google-signin-button" class="google-signin-slot"></div>

        <p class="auth-switch">Já tem conta? <a href="login.html" class="auth-switch-link">Entrar</a></p>
      </div>
    </main>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>
  <script src="js/hero-carousel.js"></script>
  <script>
    function ronuTratarCredencialGoogle(response) {
      ronuLoginComGoogle(response.credential)
        .then(() => ronuRedirecionarPosAuth())
        .catch((erro) => {
          ronuMostrarErroFormulario(document.getElementById('form-error'), erro.message);
        });
    }

    window.addEventListener('load', () => {
      google.accounts.id.initialize({
        client_id: '718933216357-u2b86snquurf6ie5m1hb9lbhu7do3opi.apps.googleusercontent.com',
        callback: ronuTratarCredencialGoogle
      });
      google.accounts.id.renderButton(
        document.getElementById('google-signin-button'),
        { theme: 'filled_black', size: 'large', width: 320, text: 'signup_with' }
      );

      initHeroCarousel(document.getElementById('authCarousel'), {
        autoDelay: 5000,
        resumeDelay: 8000,
      });
    });
  </script>
</body>
</html>
