<!DOCTYPE html>
<html lang="pt-BR" data-auth-tela="cadastro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronu — Criar conta</title>
  <meta name="description" content="Crie sua conta no Ronu para gerar dietas personalizadas a partir do seu treino de artes marciais.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page">

    <aside class="auth-brand">
      <a href="landing/v1/index.html" class="wordmark">ronu<span>.</span></a>
      <div class="auth-brand-visual" role="img" aria-label="Espaço reservado para imagem de atleta em treino"></div>
      <p class="auth-brand-quote">Sua dieta calcula o que seu treino realmente gasta.</p>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1 class="auth-title">Criar sua conta</h1>
        <p class="auth-subtitle">Leva menos de um minuto.</p>

        <div class="form-message form-message-error" id="form-error" hidden></div>

        <form id="cadastro-form" novalidate>
          <div class="field">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" required>
          </div>

          <div class="field" id="field-confirmar-senha">
            <label for="confirmar-senha">Confirmar senha</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" autocomplete="new-password" required>
            <span class="field-error-message" id="confirmar-senha-error" hidden></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
            <span class="btn-label">Criar conta</span>
          </button>
        </form>

        <p class="auth-switch">Já tem conta? <a href="login.html" class="auth-switch-link">Entrar</a></p>
      </div>
    </main>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
